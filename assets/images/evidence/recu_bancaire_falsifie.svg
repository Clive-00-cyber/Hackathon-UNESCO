<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="700" height="480">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2ece0"/>
      <stop offset="100%" stop-color="#e8e0d0"/>
    </linearGradient>
  </defs>
  <rect width="700" height="480" fill="#0d0806"/>
  <rect x="20" y="20" width="660" height="440" fill="url(#paper)" rx="4"/>

  <!-- en-tête générique de modèle de facture gratuit -->
  <rect x="20" y="20" width="660" height="70" fill="#d8cfba" rx="4"/>
  <text x="45" y="55" font-family="Georgia, serif" font-size="22" fill="#3a3226">BANQUE CENTRALE UNIVERSITAIRE</text>
  <text x="45" y="76" font-family="Georgia, serif" font-size="12" fill="#6b6250">Relevé de virement — Confidentiel</text>
  <rect x="560" y="35" width="90" height="40" fill="#c9c0a8" rx="2"/>
  <text x="605" y="59" font-family="Georgia, serif" font-size="10" fill="#8a8060" text-anchor="middle">LOGO</text>

  <!-- corps du document -->
  <text x="45" y="130" font-family="Georgia, serif" font-size="13" fill="#4a4030">Date d'émission :</text>
  <text x="220" y="130" font-family="Georgia, serif" font-size="13" fill="#2a2418">14/12/20XX — 22:47</text>

  <text x="45" y="160" font-family="Georgia, serif" font-size="13" fill="#4a4030">Compte émetteur :</text>
  <text x="220" y="160" font-family="Georgia, serif" font-size="13" fill="#2a2418">BDE — Université Centrale</text>

  <!-- zone "Bénéficiaire" : bordure suspecte, décalage de police -->
  <rect x="215" y="182" width="230" height="22" fill="none" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 2" opacity="0.55"/>
  <text x="45" y="198" font-family="Georgia, serif" font-size="13" fill="#4a4030">Bénéficiaire :</text>
  <text x="220" y="198" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#111">Compte anonyme #77201</text>

  <!-- zone montant : même défaut carré (pixellisation grossière) -->
  <rect x="215" y="220" width="200" height="26" fill="none" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 2" opacity="0.55"/>
  <text x="45" y="238" font-family="Georgia, serif" font-size="13" fill="#4a4030">Montant :</text>
  <text x="220" y="238" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#111">5 000 000 XOF</text>

  <text x="45" y="270" font-family="Georgia, serif" font-size="13" fill="#4a4030">Référence :</text>
  <text x="220" y="270" font-family="Georgia, serif" font-size="13" fill="#2a2418">REF-BDE-2025-1147</text>

  <!-- nom "Musashi" collé après coup : police et alignement différents -->
  <rect x="215" y="290" width="230" height="24" fill="none" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 2" opacity="0.55"/>
  <text x="45" y="308" font-family="Georgia, serif" font-size="13" fill="#4a4030">Autorisé par :</text>
  <text x="221" y="307" font-family="Arial, sans-serif" font-size="13" fill="#111">Miyamoto Musashi</text>

  <!-- filigrane / trame de fond générique -->
  <text x="120" y="410" font-family="Georgia, serif" font-size="60" fill="#000" opacity="0.045" transform="rotate(-18 350 400)">MODÈLE GRATUIT — FACTURE-TEMPLATE-04</text>

  <!-- annotation d'analyse (repère visuel du "défaut") -->
  <circle cx="330" cy="231" r="45" fill="none" stroke="#c0392b" stroke-width="2" opacity="0.75"/>
  <text x="330" y="352" font-family="Georgia, serif" font-size="12" fill="#c0392b" text-anchor="middle" opacity="0.85">↑ artefact de collage détecté</text>

  <text x="45" y="440" font-family="Georgia, serif" font-size="10" fill="#8a8060">Document non certifié — analyse technique en cours</text>
</svg>
